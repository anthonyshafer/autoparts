[package]
name = "stockscanner"
version = "1.3.0"
description = "StockScanner — EMA swing system (Tauri + Rust shell over the Python engine)"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yahoo_finance_api = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
time = "0.3"

[features]
custom-protocol = ["tauri/custom-protocol"]
