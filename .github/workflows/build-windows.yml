name: Build Windows App

# Builds StockScanner.exe on a GitHub-hosted Windows runner and attaches it as a
# downloadable artifact. No local Python, no venv, nothing to install on your side —
# push (or click "Run workflow"), wait a few minutes, download the .exe.

on:
  push:
    branches: [ main ]
    paths:
      - "tools/**"
      - "StockScanner.spec"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -r requirements.txt

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean StockScanner.spec

      - name: Smoke-test the build exists
        run: |
          if (-Not (Test-Path "dist/StockScanner.exe")) { throw "StockScanner.exe was not produced" }
          Get-Item "dist/StockScanner.exe" | Format-List Name, Length

      - name: Upload StockScanner.exe
        uses: actions/upload-artifact@v4
        with:
          name: StockScanner-windows
          path: dist/StockScanner.exe
          if-no-files-found: error

      # On a version tag (e.g. git tag v1.0 && git push --tags) also publish a Release
      # with the .exe attached, so non-technical users get a clean download page.
      - name: Attach to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/StockScanner.exe
